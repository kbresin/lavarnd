<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LavaRnd demos{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="{% block main_class %}{% endblock %}">
  {% if request.endpoint != "index" %}<a class="back" href="{{ url_for('index') }}">← LavaRnd demos</a>{% endif %}
  {% block content %}{% endblock %}
</main>
<script>window.LAVA = {{ {"bytes": url_for("api_bytes"), "frames": url_for("api_frames")} | tojson }};</script>
<script src="{{ url_for('static', filename='common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
